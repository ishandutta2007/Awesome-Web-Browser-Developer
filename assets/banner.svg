<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-gradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatWave{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.2}50%{opacity:.8}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.animated-bg-elem,.glow-circle{animation:floatWave 8s ease-in-out infinite;transform-origin:center}.glow-circle{animation:pulseGlow 4s ease-in-out infinite}.p1{animation:floatParticle 5s ease-in-out infinite}.p2{animation:floatParticle 7s ease-in-out infinite 1s}.p3{animation:floatParticle 6s ease-in-out infinite 2s}</style><rect width="1200" height="320" fill="url(#bg-gradient)" rx="16"/><g opacity=".05"><path stroke="#fff" stroke-width="1" d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200"/><path stroke="#fff" stroke-width="1" d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320"/></g><circle cx="1000" cy="160" r="180" fill="#6366f1" class="glow-circle" filter="url(#glow)" opacity=".25"/><circle cx="200" cy="280" r="120" fill="#0ea5e9" class="glow-circle" filter="url(#glow)" opacity=".15"/><g class="animated-bg-elem" opacity=".4"><rect width="320" height="220" x="820" y="50" fill="url(#card-grad)" stroke="#334155" stroke-width="2" rx="12"/><circle cx="845" cy="70" r="5" fill="#ef4444"/><circle cx="860" cy="70" r="5" fill="#eab308"/><circle cx="875" cy="70" r="5" fill="#22c55e"/><rect width="80" height="150" x="840" y="95" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/><rect width="120" height="150" x="930" y="95" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" rx="6"/><rect width="60" height="150" x="1060" y="95" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" rx="6"/></g><circle cx="150" cy="80" r="3" fill="#38bdf8" class="p1"/><circle cx="750" cy="240" r="4" fill="#818cf8" class="p2"/><circle cx="1100" cy="80" r="3" fill="#c084fc" class="p3"/><g><g transform="translate(70, 0) translate(0, 55)"><rect width="240" height="30" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="15"/><text x="15" y="20" class="badge-text">🌐 DEV BROWSER ECOSYSTEM</text></g><text x="0" y="140" class="title" transform="translate(70, 0)">Awesome Web Browser <tspan fill="url(#accent-grad)">Developer</tspan></text><text x="0" y="185" class="subtitle" transform="translate(70, 0)">Curated SaaS platforms, open-source dev browsers, &amp; responsive testing tools 🚀</text><g transform="translate(70, 0) translate(0, 225)"><rect width="160" height="36" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="15" y="23" fill="#e2e8f0" font-family="system-ui" font-size="13" font-weight="600">⚡ 15+ Dev Browsers</text><rect width="175" height="36" x="175" y="0" fill="#1e293b" stroke="#334155" stroke-width="1"