<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #38bdf8; }
    
    /* Background wave animation */
    @keyframes floatWave {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    
    /* Pulse glow */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }

    /* Floating particles in background */
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-30px); opacity: 0.2; }
    }

    .animated-bg-elem { animation: floatWave 8s ease-in-out infinite; transform-origin: center; }
    .glow-circle { animation: pulseGlow 4s ease-in-out infinite; transform-origin: center; }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg-gradient)" rx="16"/>
  
  <!-- Subtle Background Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Background Ambient Glow (Behind text, far right & bottom) -->
  <circle cx="1000" cy="160" r="180" fill="#6366f1" opacity="0.25" class="glow-circle" filter="url(#glow)"/>
  <circle cx="200" cy="280" r="120" fill="#0ea5e9" opacity="0.15" class="glow-circle" filter="url(#glow)"/>

  <!-- Dynamic / Animated Background Graphics (Positioned around/behind side areas so foreground text is clear) -->
  <g class="animated-bg-elem" opacity="0.4">
    <!-- Code Window Graphic on Right Side -->
    <rect x="820" y="50" width="320" height="220" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="2"/>
    <circle cx="845" cy="70" r="5" fill="#ef4444"/>
    <circle cx="860" cy="70" r="5" fill="#eab308"/>
    <circle cx="875" cy="70" r="5" fill="#22c55e"/>
    <!-- Mock UI Viewports inside code graphic -->
    <rect x="840" y="95" width="80" height="150" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="930" y="95" width="120" height="150" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="1060" y="95" width="60" height="150" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
  </g>

  <!-- Floating particles in background -->
  <circle cx="150" cy="80" r="3" fill="#38bdf8" class="p1"/>
  <circle cx="750" cy="240" r="4" fill="#818cf8" class="p2"/>
  <circle cx="1100" cy="80" r="3" fill="#c084fc" class="p3"/>

  <!-- Foreground Content Container (Guaranteed Clear Text) -->
  <g transform="translate(70, 0)">
    <!-- Top Pill / Badge -->
    <g transform="translate(0, 55)">
      <rect width="240" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="15" y="20" class="badge-text">🌐 DEV BROWSER ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="140" class="title">
      Awesome Web Browser <tspan fill="url(#accent-grad)">Developer</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">
      Curated SaaS platforms, open-source dev browsers, &amp; responsive testing tools 🚀
    </text>

    <!-- Metric / Feature Highlights Badges -->
    <g transform="translate(0, 225)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">⚡ 15+ Dev Browsers</text>

      <!-- Item 2 -->
      <rect x="175" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="190" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">📱 Responsive Testing</text>

      <!-- Item 3 -->
      <rect x="365" y="0" width="175" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="380" y="23" font-family="system-ui" font-size="13" font-weight="600" fill="#e2e8f0">🛠️ Advanced DevTools</text>
    </g>
  </g>
</svg>
